spring:
  application:
    name: fitmeasure
  profiles:
    default: local
  thymeleaf:
    cache: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  forward-headers-strategy: framework
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:fitmeasure;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}   # 콘솔에서 secret 발급했으면
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id