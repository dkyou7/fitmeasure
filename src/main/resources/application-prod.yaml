spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update      # 신규라 update (첫 배포 때 스키마 생성)
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  thymeleaf:
    cache: true
  sql:
    init:
      mode: never