<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/member-layout}">
<head>
    <title>헬스장 연결</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <th:block layout:fragment="styles">
        <style>
            .cc-wrap{max-width:400px;margin:0 auto;text-align:center;}
            .cc-lead{font-size:14px;color:var(--sub);margin-bottom:24px;line-height:1.6;}
            .cc-code{font-size:44px;font-weight:800;letter-spacing:0.15em;color:var(--orange);
                background:var(--tint);border-radius:16px;padding:20px;margin-bottom:12px;}
            .cc-timer{font-size:13px;color:var(--sub);margin-bottom:20px;}
            .cc-timer.expired{color:var(--orange);font-weight:700;}
            .cc-qr{display:flex;justify-content:center;margin-bottom:20px;}
            .cc-qr.dim{opacity:0.3;}
            .cc-regen{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;
                border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:16px;}
            .cc-note{font-size:12px;color:var(--sub);line-height:1.5;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="cc-wrap">
        <h1 style="font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;">헬스장 연결</h1>
        <div class="cc-lead">
            트레이너에게 아래 코드를 보여주거나<br>QR을 스캔하게 하세요.
        </div>

        <div class="cc-code" id="codeBox" th:text="${code}">123456</div>
        <div class="cc-timer" id="timer">유효시간 5:00</div>

        <div class="cc-qr" id="qrWrap"><div id="qr"></div></div>

        <button class="cc-regen" onclick="location.reload()">코드 다시 만들기</button>

        <div class="cc-note">
            코드는 5분간 유효해요.<br>
            연결되면 이 헬스장의 측정 기록이 내 계정에 쌓입니다.
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        const code = /*[[${code}]]*/ '000000';
        const url = location.origin + '/connect?code=' + code;
        new QRCode(document.getElementById('qr'), { text: url, width: 180, height: 180 });

        // 5분 카운트다운
        let remain = 5 * 60;
        const timer = document.getElementById('timer');
        const qrWrap = document.getElementById('qrWrap');
        const tick = setInterval(() => {
            remain--;
            if (remain <= 0) {
                clearInterval(tick);
                timer.textContent = '만료됨 · 코드를 다시 만들어주세요';
                timer.classList.add('expired');
                qrWrap.classList.add('dim');
                return;
            }
            const m = Math.floor(remain / 60);
            const s = String(remain % 60).padStart(2, '0');
            timer.textContent = `유효시간 ${m}:${s}`;
        }, 1000);
    </script>
</th:block>
</body>
</html>
