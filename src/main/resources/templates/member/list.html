<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>회원 관리</title>
    <th:block layout:fragment="styles">
        <style>
            .form{display:flex;gap:8px;margin-bottom:24px;padding:16px;}
            .form input[name=nickname]{flex:1;}
            .form input[name=memberNo]{flex:0 0 140px;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <h1>회원 관리</h1>

    <div class="form card">
        <input type="text" name="nickname" id="nickname" placeholder="이름 (비우면 자동 생성)">
        <input type="text" name="memberNo" id="memberNo" placeholder="회원번호 (선택)">
        <button class="btn" hx-post="/members" hx-include="#nickname, #memberNo"
                hx-target="#memberTable" hx-swap="outerHTML"
                hx-on::after-request="document.getElementById('nickname').value='';document.getElementById('memberNo').value='';">
            회원 등록
        </button>
    </div>

    <div th:fragment="memberTable" id="memberTable">
        <table th:if="${!members.isEmpty()}">
            <thead><tr><th>이름</th><th>회원번호</th><th>등록일</th><th></th></tr></thead>
            <tbody>
            <tr th:each="m : ${members}">
                <td>
                    <a th:href="@{/members/{id}(id=${m.membershipId})}" th:text="${m.nickname}"
                       style="color:inherit;text-decoration:none;font-weight:600;">이름 없는 곰</a>
                    <span class="badge" th:if="${m.anonymous}">익명</span>
                </td>
                <td th:text="${m.memberNo} ?: '-'">-</td>
                <td th:text="${#temporals.format(m.joinedAt, 'yyyy.MM.dd')}">2026.03.05</td>
                <td><a th:href="@{/measure/{id}(id=${m.membershipId})}"
                       style="color:var(--orange);font-weight:600;text-decoration:none;">측정하기 →</a></td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${members.isEmpty()}">아직 등록된 회원이 없습니다.</div>
    </div>
</div>
</body>
</html>
