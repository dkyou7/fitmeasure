<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>회원 관리</title></head>
<body>
<div layout:fragment="content">
    <a class="back" style="margin-bottom: 10px" href="/">← 뒤로 가기</a>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">회원 관리</h1>
        <a href="/members/connect" class="btn btn-primary">+ 회원 연결</a>
    </div>

    <!-- 연결 안내 -->
    <div class="card p-3 mb-4" style="background:#F6F5F1;border:none;">
        <div class="text-secondary" style="font-size:13px;line-height:1.6;">
            회원이 앱에서 발급한 <b>6자리 코드</b>를 받아 연결하세요.
            연결하면 이 헬스장의 측정 기록이 회원 계정에 쌓입니다.
        </div>
    </div>

    <div class="alert d-flex justify-content-between align-items-center mb-3"
         style="background:#FFF4EF;border:1px solid #FF5A1F;border-radius:12px;padding:14px 18px;"
         th:if="${limitMessage}">
        <span class="text-primary fw-semibold" th:text="${limitMessage}">무료 한도 초과</span>
        <a class="btn btn-primary btn-sm" href="/owner/plans" sec:authorize="hasRole('OWNER')">요금제 보기</a>
    </div>

    <table class="table table-hover align-middle mb-0" th:if="${!members.isEmpty()}">
        <thead><tr><th>이름</th><th>마지막 측정</th><th class="text-end">관리</th></tr></thead>
        <tbody>
        <tr th:each="m : ${members}">
            <td>
                <a th:href="@{/members/{id}(id=${m.membershipId})}" th:text="${m.nickname}"
                   style="color:inherit;text-decoration:none;font-weight:600;">홍길동</a>
            </td>
            <td class="text-secondary" style="font-size:14px;"
                th:text="${m.lastMeasuredDate != null} ? ${#temporals.format(m.lastMeasuredDate, 'yyyy.MM.dd')} : '측정 전'">-</td>
            <td class="text-end">
                <a th:href="@{/members/{id}(id=${m.membershipId})}"
                   class="btn btn-sm btn-outline-secondary">기록 보기</a>
                <a th:href="@{/measure/{id}(id=${m.membershipId})}"
                   class="btn btn-sm btn-primary">측정하기</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="text-center text-secondary py-5" th:if="${members.isEmpty()}">
        아직 연결된 회원이 없습니다.<br>
        <a href="/members/connect" class="btn btn-primary mt-3">첫 회원 연결하기</a>
    </div>
</div>
</body>
</html>
