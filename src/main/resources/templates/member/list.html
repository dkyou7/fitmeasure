<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>회원 관리</title></head>
<body>
<div layout:fragment="content">
    <h1 class="mb-4">회원 관리</h1>

    <div class="card p-3 mb-4">
        <div class="row g-2">
            <div class="col"><input class="form-control" name="nickname" id="nickname" placeholder="이름 (비우면 자동 생성)"></div>
            <div class="col-auto"><input class="form-control" name="memberNo" id="memberNo" placeholder="회원번호" style="width:140px;"></div>
            <div class="col-auto">
                <button class="btn btn-primary" hx-post="/members" hx-include="#nickname,#memberNo"
                        hx-target="#memberTable" hx-swap="outerHTML"
                        hx-on::after-request="nickname.value='';memberNo.value='';">회원 등록</button>
            </div>
        </div>
    </div>

    <div th:fragment="memberTable" id="memberTable">
        <div class="alert d-flex justify-content-between align-items-center mb-3"
             style="background:#FFF4EF;border:1px solid #FF5A1F;border-radius:12px;padding:14px 18px;"
             th:if="${limitMessage}">
            <span class="text-primary fw-semibold" th:text="${limitMessage}">무료 한도 초과</span>
            <a class="btn btn-primary btn-sm" href="/owner/plans" sec:authorize="hasRole('OWNER')">요금제 보기</a>
        </div>
        <table class="table table-hover align-middle mb-0" th:if="${!members.isEmpty()}">
            <thead><tr><th>이름</th><th>회원번호</th><th>등록일</th><th></th></tr></thead>
            <tbody>
            <tr th:each="m : ${members}">
                <td>
                    <a class="fw-semibold text-decoration-none text-body"
                       th:href="@{/members/{id}(id=${m.membershipId})}" th:text="${m.nickname}">이름 없는 곰</a>
                    <span class="badge bg-tint ms-1" th:if="${m.anonymous}">익명</span>
                </td>
                <td th:text="${m.memberNo} ?: '-'">-</td>
                <td th:text="${#temporals.format(m.joinedAt, 'yyyy.MM.dd')}">2026.03.05</td>
                <td><a class="text-primary fw-semibold text-decoration-none"
                       th:href="@{/measure/{id}(id=${m.membershipId})}">측정하기 →</a></td>
            </tr>
            </tbody>
        </table>
        <div class="text-center text-secondary py-5" th:if="${members.isEmpty()}">아직 등록된 회원이 없습니다.</div>
    </div>
</div>
</body>
</html>
