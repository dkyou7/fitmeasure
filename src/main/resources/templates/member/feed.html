<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/member-layout}">
<head>
    <title>내 운동력</title>
    <th:block layout:fragment="styles">
        <style>
            .feed-item{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;
                padding:18px;margin-bottom:12px;text-decoration:none;color:inherit;transition:border-color .15s;}
            .feed-item:hover{border-color:var(--orange);}
            .feed-item .club{font-size:13px;color:var(--orange);font-weight:600;}
            .feed-item .prog{font-size:18px;font-weight:700;margin:2px 0;letter-spacing:-0.02em;}
            .feed-item .meta{font-size:13px;color:var(--sub);}
            .empty{text-align:center;color:var(--sub);padding:48px 20px;}
            .promo{display:block;background:linear-gradient(135deg, #ff8e64, #da6735);border-radius:16px;
                padding:22px 20px;margin-bottom:20px;text-decoration:none;color:#fff;position:relative;overflow:hidden;
                box-shadow:0 6px 24px rgba(255,90,31,0.28);transition:transform .12s;}
            .promo:hover{transform:translateY(-2px);}
            .promo::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;
                background:rgba(255,255,255,0.12);border-radius:50%;}
            .promo-badge{display:inline-block;background:rgba(255,255,255,0.22);font-size:12px;font-weight:700;
                padding:3px 12px;border-radius:100px;margin-bottom:10px;letter-spacing:0.02em;}
            .promo-title{font-size:20px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px;}
            .promo-sub{font-size:13px;opacity:0.92;line-height:1.5;margin-bottom:14px;}
            .promo-cta{font-size:15px;font-weight:700;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <!-- 프로모션 배너 (기록 없을 때만) -->
    <a href="/contact" class="promo" th:if="${feed.isEmpty()}">
        <div class="promo-badge">파트너 모집</div>
        <div class="promo-title">헬스장을 운영하고 계신가요?</div>
        <div class="promo-sub">회원의 성장을 데이터로 보여주는 측정 솔루션, 도입 문의하세요</div>
        <div class="promo-cta">도입 문의하기 →</div>
    </a>

    <!-- 측정 기록 목록 -->
    <a class="feed-item" th:each="f : ${feed}"
       th:href="@{/measure/result/{sid}(sid=${f.sessionId})}">
        <div class="club" th:text="${f.clubName}">데모 헬스장</div>
        <div class="prog" th:text="${f.programName}">3대 측정</div>
        <div class="meta">
            <span th:text="${#temporals.format(f.measuredAt, 'yyyy.MM.dd HH:mm')}">2026.09.04 15:30</span>
            · <span th:text="${f.itemCount}">3</span>개 측정
        </div>
    </a>

    <!-- 빈 상태 (하나만) -->
    <div class="empty" th:if="${feed.isEmpty()}">
        아직 측정 기록이 없어요.<br>
        헬스장에서 <b>헬스장 연결</b> 후 측정받으면<br>기록이 여기 쌓입니다.
    </div>
</div>
</body>
</html>
