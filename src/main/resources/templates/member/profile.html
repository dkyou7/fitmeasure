<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/member-layout}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>내 정보</title>
    <th:block layout:fragment="styles">
        <style>
            .pf-wrap{max-width:400px;margin:0 auto;}
            .pf-saved{background:var(--tint);color:var(--orange-deep);font-size:13px;
                padding:10px 14px;border-radius:10px;margin-bottom:16px;}
            .pf-label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:6px;}
            .pf-input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:15px;
                font-family:inherit;margin-bottom:16px;}
            .pf-input:focus{outline:none;border-color:var(--orange);}
            .pf-btn{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:12px;
                font-size:16px;font-weight:700;cursor:pointer;}
            .pf-btn:hover{background:var(--orange-deep);}
            .pf-info{background:#F1EFE8;border-radius:12px;padding:16px 18px;margin-bottom:20px;}
            .pf-info .row{display:flex;justify-content:space-between;padding:6px 0;}
            .pf-info .k{font-size:13px;color:var(--sub);}
            .pf-info .v{font-size:14px;font-weight:600;}
            .pf-err{background:var(--tint);color:var(--orange-deep);font-size:13px;
                padding:10px 14px;border-radius:10px;margin-bottom:16px;}
            .pf-divider{border:none;border-top:1px solid var(--line);margin:20px 0;}
            .pf-sub{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="pf-wrap">
        <h1 style="font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:20px;">내 정보</h1>

        <div class="pf-saved" th:if="${param.saved}">저장됐어요.</div>

        <!-- 계정 정보 -->
        <div class="pf-info">
            <div class="row">
                <span class="k">아이디</span>
                <span class="v" th:text="${profile.username} ?: '미설정'">dong123</span>
            </div>
        </div>

        <!-- 아이디 미설정 시: 아이디 로그인 추가 -->
        <div th:if="${profile.username == null}">
            <div style="font-size:14px;font-weight:600;margin-bottom:4px;">아이디 로그인 추가</div>
            <div class="pf-sub">아이디와 비밀번호를 등록하면 카카오 없이도 로그인할 수 있어요.</div>
            <div class="pf-err" th:if="${usernameError}" th:text="${usernameError}"></div>
            <form th:action="@{/me/profile/username}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input class="pf-input" type="text" name="username" placeholder="아이디" required>
                <input class="pf-input" type="password" name="password" placeholder="비밀번호" required>
                <button type="submit" class="pf-btn" style="background:var(--ink);">아이디 등록</button>
            </form>
            <hr class="pf-divider">
        </div>

        <!-- 프로필 수정 -->
        <form th:action="@{/me/profile}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="pf-label">이름</label>
            <input class="pf-input" type="text" name="name" th:value="${profile.name}" placeholder="이름을 입력하세요">

            <label class="pf-label">연락처</label>
            <input class="pf-input" type="tel" name="phone" th:value="${profile.phone}" placeholder="01012345678">

            <div th:if="${profile.hasClub}">
                <label class="pf-label">이 헬스장에서 표시될 이름</label>
                <input class="pf-input" type="text" name="nickname" th:value="${profile.nickname}" placeholder="닉네임">
            </div>
            <button type="submit" class="pf-btn">저장</button>
        </form>
    </div>
</div>
</body>
</html>
