<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 정보</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--line:#ECEBE7;--tint:#FFF4EF;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:#F1EFE8;color:var(--ink);line-height:1.6;
            padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;letter-spacing:-0.01em;}
        .card{background:var(--bg);border-radius:24px;padding:32px 28px;max-width:400px;width:100%;
            box-shadow:0 8px 40px rgba(0,0,0,0.08);}
        a.back{font-size:13px;color:var(--sub);text-decoration:none;}
        a.back:hover{color:var(--orange);}
        h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin:8px 0 20px;}
        .saved{background:var(--tint);color:#E64500;font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
        label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:6px;}
        input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:15px;
            font-family:inherit;margin-bottom:16px;}
        input:focus{outline:none;border-color:var(--orange);}
        input:disabled{background:#F1EFE8;color:var(--sub);}
        .btn{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:12px;
            font-size:16px;font-weight:700;cursor:pointer;}
        .btn:hover{background:#E64500;}
        .info-box{background:#F1EFE8;border-radius:12px;padding:16px 18px;margin-bottom:12px;}
        .info-row{display:flex;justify-content:space-between;padding:6px 0;}
        .info-row .k{font-size:13px;color:var(--sub);}
        .info-row .v{font-size:14px;font-weight:600;}
        .info-row .v.muted{color:var(--orange);font-weight:600;}
        .phone-hint{font-size:12px;color:var(--sub);background:var(--tint);border-radius:10px;
            padding:12px 14px;line-height:1.5;margin-bottom:8px;}
    </style>
</head>
<body>
<div class="card">
    <a sec:authorize="hasRole('ADMIN')" class="back" href="/admin">← 돌아가기</a>
    <a sec:authorize="!hasRole('ADMIN') and hasAnyRole('OWNER','STAFF')" class="back" href="/">← 돌아가기</a>
    <a sec:authorize="!hasAnyRole('ADMIN','OWNER','STAFF')" class="back" href="/me">← 돌아가기</a>
    <h1>내 정보</h1>

    <div class="saved" th:if="${param.saved}">저장됐어요.</div>

    <!-- 계정 정보 (읽기전용) -->
    <div class="info-box">
        <div class="info-row">
            <span class="k">아이디</span>
            <span class="v" th:text="${profile.username} ?: '-'">dong123</span>
        </div>
    </div>

    <hr style="border:none;border-top:1px solid var(--line);margin:20px 0;">

    <!-- 수정 -->
    <form th:action="@{/me/profile}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>이름</label>
        <input type="text" name="name" th:value="${profile.name}" placeholder="이름을 입력하세요">

        <label>연락처</label>
        <input type="tel" name="phone" th:value="${profile.phone}" placeholder="01012345678">

        <div th:if="${profile.hasClub}">
            <label>이 헬스장에서 표시될 이름</label>
            <input type="text" name="nickname" th:value="${profile.nickname}" placeholder="닉네임">
        </div>
        <button type="submit" class="btn">저장</button>
    </form>
</div>
</body>
</html>
