<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/member-layout}">
<head>
    <title>홈</title>
    <th:block layout:fragment="styles">
        <style>
            .hero{background:linear-gradient(135deg,#FF8E64,#E64500);border-radius:20px;
                padding:32px 24px;color:#fff;margin-bottom:28px;position:relative;overflow:hidden;}
            .hero::after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;
                background:rgba(255,255,255,0.12);border-radius:50%;}
            .hero h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1.3;margin-bottom:8px;}
            .hero p{font-size:14px;opacity:0.92;line-height:1.55;}
            .sec-title{font-size:16px;font-weight:700;letter-spacing:-0.02em;margin:24px 0 12px;}
            .values{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
            .value{display:flex;gap:12px;align-items:flex-start;background:#fff;
                border:1px solid var(--line);border-radius:14px;padding:16px;}
            .value .ic{flex-shrink:0;width:38px;height:38px;border-radius:11px;background:var(--tint);
                color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:18px;}
            .value h3{font-size:15px;font-weight:700;margin-bottom:2px;}
            .value p{font-size:13px;color:var(--sub);line-height:1.5;}
            .gym-item{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;
                padding:16px 18px;margin-bottom:10px;text-decoration:none;color:inherit;}
            .gym-item:hover{border-color:var(--orange);}
            .gym-item .name{font-size:16px;font-weight:700;}
            .gym-item .addr{font-size:13px;color:var(--sub);margin-top:2px;}
            .gym-empty{text-align:center;color:var(--sub);padding:24px;font-size:14px;line-height:1.6;}
            .recent{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;
                padding:14px 16px;margin-bottom:8px;text-decoration:none;color:inherit;}
            .recent .c{font-size:12px;color:var(--orange);font-weight:600;}
            .recent .p{font-size:15px;font-weight:700;margin:2px 0;}
            .recent .d{font-size:12px;color:var(--sub);}
            .more-link{display:block;text-align:center;font-size:14px;color:var(--sub);
                text-decoration:none;padding:8px;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <!-- 히어로 -->
    <div class="hero">
        <h1>측정하고, 기록하고,<br>더 나아지다</h1>
        <p>트레이너가 측정한 내 운동력을<br>숫자와 그래프로 확인하세요.</p>
    </div>

    <!-- 가치 -->
    <div class="values">
        <div class="value">
            <div class="ic">✓</div>
            <div><h3>정확한 측정</h3><p>트레이너가 정해진 기준으로 직접 측정해요.</p></div>
        </div>
        <div class="value">
            <div class="ic">↗</div>
            <div><h3>성장 확인</h3><p>지난 기록과 비교해 얼마나 늘었는지 그래프로 봐요.</p></div>
        </div>
        <div class="value">
            <div class="ic">◆</div>
            <div><h3>어디서든 이어서</h3><p>헬스장을 옮겨도 내 기록은 계속 쌓여요.</p></div>
        </div>
    </div>

    <!-- 최근 기록 (있으면) -->
    <div th:if="${!recentFeed.isEmpty()}">
        <div class="sec-title">최근 측정</div>
        <a class="recent" th:each="f : ${recentFeed}"
           th:href="@{/measure/result/{sid}(sid=${f.sessionId})}">
            <div class="c" th:text="${f.clubName}">데모 헬스장</div>
            <div class="p" th:text="${f.programName}">3대 측정</div>
            <div class="d" th:text="${#temporals.format(f.measuredAt, 'yyyy.MM.dd')}">2026.09.04</div>
        </a>
        <a class="more-link" href="/me/records">내 기록 전체 보기 →</a>
    </div>

    <!-- 헬스장 찾기 -->
    <div class="sec-title">측정 가능한 헬스장</div>
    <a class="gym-item" th:each="c : ${clubs}" th:href="@{/club/{id}(id=${c.clubId})}">
        <div class="name" th:text="${c.name}">스트롱짐 강남점</div>
        <div class="addr" th:text="${c.address} ?: '위치 정보 없음'">서울 강남구</div>
    </a>
    <div class="gym-empty" th:if="${clubs.isEmpty()}">
        측정 서비스를 제공하는 헬스장을<br>곧 만나보실 수 있어요.
    </div>
</div>
</body>
</html>
