<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 기록으로 남기기</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--line:#ECEBE7;--tint:#FFF4EF;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:#F1EFE8;color:var(--ink);line-height:1.6;
            padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;letter-spacing:-0.01em;}
        .card{background:var(--bg);border-radius:24px;padding:28px 24px;max-width:360px;width:100%;
            box-shadow:0 8px 40px rgba(0,0,0,0.08);}
        h1{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;}
        .sub{font-size:14px;color:var(--sub);margin-bottom:22px;}
        label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:6px;}
        input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px;
            font-family:inherit;margin-bottom:16px;}
        input:focus{outline:none;border-color:var(--orange);}
        .err{background:var(--tint);color:#E64500;font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
        .btn{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:12px;
            font-size:16px;font-weight:700;cursor:pointer;}
        .btn:hover{background:#E64500;}
        .note{font-size:12px;color:var(--sub);text-align:center;margin-top:14px;line-height:1.5;}
    </style>
</head>
<body>
<div class="card">
    <h1>내 기록으로 남기기</h1>
    <div class="sub">
        <span th:text="${form.clubName}">스트롱짐</span>의 측정 기록을
        내 것으로 이어서 볼 수 있어요.
    </div>

    <div class="err" th:if="${error}" th:text="${error}">오류</div>

    <form th:action="@{/s/{token}/claim(token=${form.shareToken})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>이름</label>
        <input type="text" name="name" th:value="${form.currentNickname}" placeholder="이름">
        <label>휴대폰 번호</label>
        <input type="tel" name="phone" placeholder="01012345678" required>
        <label>비밀번호</label>
        <input type="password" name="password" placeholder="로그인에 쓸 비밀번호" required>
        <button type="submit" class="btn">기록 이어받기</button>
    </form>

    <div class="note">번호는 기록을 이어보기 위한 용도로만 쓰여요.</div>
</div>
</body>
</html>
