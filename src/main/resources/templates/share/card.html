<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${card.nickname} + ' 운동력 측정'">운동력 측정 결과</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--orange-deep:#E64500;--line:#ECEBE7;--tint:#FFF4EF;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:#EEEDE9;color:var(--ink);
            line-height:1.6;padding:24px 16px;letter-spacing:-0.01em;
            min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .card{background:var(--bg);border-radius:20px;overflow:hidden;max-width:380px;width:100%;
            box-shadow:0 4px 24px rgba(0,0,0,0.06);border:1px solid var(--line);}

        /* 헤더 */
        .hd{padding:24px 24px 20px;border-bottom:1px solid var(--line);}
        .hd .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
        .hd .brand .club{font-size:14px;font-weight:700;}
        .hd .brand .badge{font-size:11px;font-weight:600;color:var(--orange-deep);
            background:var(--tint);padding:3px 10px;border-radius:100px;}
        .hd .who{font-size:22px;font-weight:800;letter-spacing:-0.03em;}
        .hd .meta{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--sub);}
        .hd .meta .dot{color:var(--line);}

        /* 측정 결과 */
        .bd{padding:22px 24px;}
        .sec-label{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:12px;
            text-transform:none;display:flex;align-items:center;gap:6px;}
        .items{display:flex;flex-direction:column;gap:2px;}
        .item{display:flex;align-items:center;justify-content:space-between;
            padding:13px 0;border-bottom:1px solid var(--line);}
        .item:last-child{border-bottom:none;}
        .item .n{font-size:15px;font-weight:500;color:var(--ink);}
        .item .v{font-size:18px;font-weight:800;letter-spacing:-0.02em;}
        .item .v .u{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px;}
        .item.skip .v{font-size:13px;color:var(--sub);font-weight:500;}

        /* 검증 배너 */
        .verify{display:flex;align-items:center;gap:8px;background:#F6F5F1;border-radius:12px;
            padding:12px 14px;margin-top:18px;}
        .verify .ic{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;
            display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
        .verify .txt{font-size:12px;color:var(--sub);line-height:1.45;}
        .verify .txt b{color:var(--ink);font-weight:600;}

        /* CTA */
        .action{padding:0 24px 24px;}
        .cta{display:block;width:100%;padding:15px;background:var(--orange);color:#fff;border:none;
            border-radius:12px;font-size:15px;font-weight:700;text-align:center;text-decoration:none;
            cursor:pointer;transition:background .15s;}
        .cta:hover{background:var(--orange-deep);}
        .cta-sub{text-align:center;font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5;}
        .foot{text-align:center;font-size:11px;color:#B4B2A9;padding:16px 24px;border-top:1px solid var(--line);}
    </style>
</head>
<body>
<div class="card">
    <div class="hd">
        <div class="brand">
            <span class="club" th:text="${card.clubName}">스트롱짐</span>
            <span class="badge">운동력 측정</span>
        </div>
        <div class="who" th:text="${card.nickname}">이름 없는 곰</div>
        <div class="meta">
            <span th:text="${#temporals.format(card.measuredDate, 'yyyy년 M월 d일')}">2026년 3월 5일</span>
            <span class="dot">·</span>
            <span><span th:text="${#lists.size(card.values)}">3</span>개 항목 측정</span>
        </div>
    </div>

    <div class="bd">
        <div class="sec-label">측정 결과</div>
        <div class="items">
            <div class="item" th:each="v : ${card.values}" th:classappend="${v.skipped} ? 'skip'">
                <span class="n" th:text="${v.name}">벤치프레스</span>
                <span class="v" th:if="${!v.skipped}">
                    <span th:text="${v.displayValue}">85</span><span class="u" th:if="${v.unit}" th:text="${v.unit}">kg</span>
                </span>
                <span class="v" th:if="${v.skipped}">측정 안 함</span>
            </div>
        </div>

        <div class="verify">
            <div class="ic">✓</div>
            <div class="txt">
                <b th:text="${card.clubName}">스트롱짐</b>에서
                <b th:if="${card.measuredByName}" th:text="${card.measuredByName}">김트레이너</b>
                <span th:if="${card.measuredByName}"> 트레이너가</span>
                정해진 기준으로 직접 측정한 기록이에요.
            </div>
        </div>
    </div>

    <div class="action">
        <!-- 비로그인 -->
        <a sec:authorize="!isAuthenticated()" class="cta"
           th:href="@{/s/{token}/claim(token=${card.shareToken})}">내 기록으로 저장하기</a>
        <div sec:authorize="!isAuthenticated()" class="cta-sub">
            저장하면 앞으로의 측정 기록이<br>내 성장 그래프로 이어집니다
        </div>
        <!-- 로그인 -->
        <form sec:authorize="isAuthenticated()" th:action="@{/s/{token}/absorb(token=${card.shareToken})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="cta">내 기록에 추가하기</button>
        </form>
    </div>

    <div class="foot" th:text="'measured by ' + ${card.clubName}">measured by 스트롱짐</div>
</div>
</body>
</html>
