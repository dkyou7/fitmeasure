<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>완료</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--tint:#FFF4EF;}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Pretendard',sans-serif;background:#F1EFE8;color:var(--ink);line-height:1.6;
      padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;letter-spacing:-0.01em;}
    .card{background:var(--bg);border-radius:24px;padding:36px 28px;max-width:360px;width:100%;
      box-shadow:0 8px 40px rgba(0,0,0,0.08);}
    .em{width:56px;height:56px;border-radius:50%;background:var(--tint);color:var(--orange);
      display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;}
    h1{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;}
    p{font-size:14px;color:var(--sub);line-height:1.6;}
  </style>
</head>
<body>
<div class="card">
  <div class="em">✓</div>
  <h1 th:text="${form.currentNickname} + '님, 시작됐어요'">시작됐어요</h1>
  <p>이제부터 측정할 때마다 기록이<br>내 히스토리로 쌓입니다.<br>다음 측정에서 성장을 확인해보세요.</p>
  <a class="cta" th:href="@{/}">페이지 둘러보기</a>
</div>
</body>
</html>
