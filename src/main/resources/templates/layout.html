<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE">측정 서비스</title>

    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        /* 브랜드 색을 Bootstrap 변수에 주입 */
        :root{
            --bs-primary:#FF5A1F;
            --bs-primary-rgb:255,90,31;
            --bs-body-bg:#FDFDFC;
            --bs-body-color:#1A1A18;
            --bs-body-font-family:'Pretendard',-apple-system,sans-serif;
            --bs-border-color:#ECEBE7;
        }
        /* primary 버튼을 브랜드 오렌지로 */
        .btn-primary{--bs-btn-bg:#FF5A1F;--bs-btn-border-color:#FF5A1F;
            --bs-btn-hover-bg:#E64500;--bs-btn-hover-border-color:#E64500;
            --bs-btn-active-bg:#E64500;}
        .text-primary{color:#FF5A1F !important;}
        .badge.bg-tint{background:#FFF4EF;color:#E64500;font-weight:600;}
        .navbar{border-bottom:1px solid var(--bs-border-color);background:rgba(253,253,252,0.9)!important;
            backdrop-filter:saturate(180%) blur(12px);}
        .navbar-brand{font-weight:800;letter-spacing:-0.03em;}
        h1{font-weight:800;letter-spacing:-0.03em;}
        .card{border-color:var(--bs-border-color);}
    </style>
    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<nav class="navbar navbar-expand sticky-top">
    <div class="container" style="max-width:900px;">
        <a class="navbar-brand" href="/">측정<span class="text-primary">.</span></a>
        <div class="navbar-nav">
            <a class="nav-link" href="/members">회원</a>
            <a class="nav-link" href="/programs">프로그램</a>
            <a class="nav-link" href="/dashboard">측정 명단</a>
            <a class="nav-link" href="/owner/billing" sec:authorize="hasRole('OWNER')">운영 현황</a>
        </div>
    </div>
    <div class="navbar-nav ms-auto align-items-center">
        <span class="nav-link text-secondary" sec:authentication="principal.nickname">사용자</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-secondary">로그아웃</button>
        </form>
    </div>
</nav>

<main class="container py-4" style="max-width:900px;"
      layout:fragment="content"></main>

<th:block layout:fragment="scripts"></th:block>
</body>
</html>
