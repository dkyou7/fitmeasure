<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE">측정 서비스</title>

    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        /* 브랜드 색을 Bootstrap 변수에 주입 */
        :root{
            --bs-primary:#FF5A1F;
            --bs-primary-rgb:255,90,31;
            --bs-body-bg:#FDFDFC;
            --bs-body-color:#1A1A18;
            --bs-body-font-family:'Pretendard',-apple-system,sans-serif;
            --bs-border-color:#ECEBE7;
            /* 커스텀 변수 추가 */
            --bg:#FDFDFC;
            --ink:#1A1A18;
            --sub:#6B6B66;
            --orange:#FF5A1F;
            --orange-deep:#E64500;
            --line:#ECEBE7;
            --tint:#FFF4EF;
        }
        /* primary 버튼을 브랜드 오렌지로 */
        .btn-primary{--bs-btn-bg:#FF5A1F;--bs-btn-border-color:#FF5A1F;
            --bs-btn-hover-bg:#E64500;--bs-btn-hover-border-color:#E64500;
            --bs-btn-active-bg:#E64500;}
        .text-primary{color:#FF5A1F !important;}
        .navbar{border-bottom:1px solid var(--bs-border-color);background:rgba(253,253,252,0.9)!important;
            backdrop-filter:saturate(180%) blur(12px);}
        .navbar-brand{font-weight:800;letter-spacing:-0.03em;}
        h1{font-weight:800;letter-spacing:-0.03em;}
        .app-footer{border-top:1px solid var(--line);margin-top:48px;padding:24px 0;background:#FDFDFC;}
        .af-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
        .af-brand{font-weight:800;font-size:15px;letter-spacing:-0.03em;}
        .af-links{display:flex;gap:16px;}
        .af-links a{font-size:13px;color:var(--sub);text-decoration:none;}
        .af-links a:hover{color:var(--orange);}
        .af-copy{font-size:13px;color:var(--sub);margin-left:auto;}
        @media(max-width:520px){
            .af-in{flex-direction:column;align-items:flex-start;gap:10px;}
            .af-copy{margin-left:0;}
        }
        body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
            letter-spacing:-0.01em;}
        main{flex:1 0 auto;}
        .app-footer{border-top:1px solid var(--line);margin-top:420px;padding:24px 0;background:#FDFDFC;}
    </style>
    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<nav class="navbar navbar-expand-md sticky-top">
    <div class="container" style="max-width:900px;">
        <a class="navbar-brand" href="/">1RepPlus<span class="text-primary">.</span></a>

        <!-- 햄버거 버튼 (md 미만에서만 보임) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMain" aria-controls="navMain"
                aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMain">
            <!-- 클럽 메뉴 (사장/트레이너) -->
            <div class="navbar-nav" sec:authorize="hasAnyRole('OWNER','STAFF')">
                <a class="nav-link" href="/members">회원</a>
                <a class="nav-link" href="/programs">프로그램</a>
                <a class="nav-link" href="/dashboard">측정 명단</a>
                <a class="nav-link" href="/owner/staff" sec:authorize="hasRole('OWNER')">트레이너</a>
                <a class="nav-link" href="/owner/billing" sec:authorize="hasRole('OWNER')">운영 현황</a>
                <a class="nav-link" href="/owner/plans" sec:authorize="hasRole('OWNER')">요금제</a>
                <a class="nav-link" href="/me">내 기록</a>
            </div>

            <!-- 운영자 메뉴 -->
            <div class="navbar-nav" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" href="/admin">플랫폼 관리</a>
            </div>

            <!-- 사용자 영역 -->
            <div class="d-flex align-items-center gap-3 ms-md-auto mt-2 mt-md-0">
                <a sec:authorize="isAuthenticated()" href="/me/profile"
                   class="text-secondary small text-decoration-none">
                    안녕하세요, <span sec:authentication="principal.nickname" class="fw-semibold text-body">회원</span>님
                </a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-outline-secondary">로그아웃</button>
                </form>
                <a sec:authorize="!isAuthenticated()" class="nav-link" href="/login">로그인</a>
                <a sec:authorize="!isAuthenticated()" class="btn btn-primary btn-sm" href="/signup">시작하기</a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4" style="max-width:900px;" layout:fragment="content"></main>

<footer class="app-footer">
    <div class="container" style="max-width:900px;">
        <div class="af-in">
            <div class="af-brand">측정<span class="text-primary">.</span></div>
            <div class="af-links">
                <a href="#">이용약관</a>
                <a href="#">개인정보 처리방침</a>
                <a href="mailto:contact@example.com">문의</a>
            </div>
            <div class="af-copy">© 2026 측정.</div>
        </div>
    </div>
</footer>

<th:block layout:fragment="scripts"></th:block>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;
        document.body.addEventListener('htmx:configRequest', function (evt) {
            evt.detail.headers[header] = token;
        });
    });
</script>
</body>
</html>
