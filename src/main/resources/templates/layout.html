<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE">측정 서비스</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--orange-deep:#E64500;--line:#ECEBE7;--tint:#FFF4EF;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
            line-height:1.6;letter-spacing:-0.01em;}
        nav{position:sticky;top:0;z-index:50;background:rgba(253,253,252,0.85);
            backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
        .nav-in{max-width:900px;margin:0 auto;padding:0 24px;height:56px;
            display:flex;align-items:center;gap:24px;}
        .nav-in .logo{font-weight:800;font-size:18px;letter-spacing:-0.03em;text-decoration:none;color:var(--ink);}
        .nav-in .logo .dot{color:var(--orange);}
        .nav-in a.link{font-size:15px;color:var(--sub);text-decoration:none;font-weight:500;}
        .nav-in a.link:hover,.nav-in a.link.active{color:var(--ink);}
        main{max-width:900px;margin:0 auto;padding:32px 24px;}

        /* 공통 컴포넌트 */
        h1{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:20px;}
        .btn{padding:11px 22px;background:var(--orange);color:#fff;border:none;border-radius:10px;
            font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;}
        .btn:hover{background:var(--orange-deep);}
        .card{background:#fff;border:1px solid var(--line);border-radius:14px;}
        table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
            border-radius:14px;overflow:hidden;}
        th,td{text-align:left;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line);}
        th{font-size:12px;color:var(--sub);font-weight:600;}
        tr:last-child td{border-bottom:none;}
        input,select,textarea{padding:11px 14px;border:1px solid var(--line);border-radius:10px;
            font-size:15px;font-family:inherit;}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);}
        .badge{font-size:12px;color:var(--orange-deep);background:var(--tint);padding:2px 10px;border-radius:100px;}
        .empty{text-align:center;color:var(--sub);padding:40px;}
    </style>

    <!-- 페이지별 추가 스타일 삽입 지점 -->
    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<nav>
    <div class="nav-in">
        <a class="logo" href="/members">측정<span class="dot">.</span></a>
        <a class="link" href="/members">회원</a>
        <a class="link" href="/programs">프로그램</a>
        <a class="link" href="/dashboard">대시보드</a>
    </div>
</nav>

<main layout:fragment="content">
    <!-- 각 페이지 본문이 여기로 -->
</main>

<!-- 페이지별 스크립트 삽입 지점 -->
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
