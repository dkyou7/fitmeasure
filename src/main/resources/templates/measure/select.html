<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>측정 프로그램 선택</title>
    <th:block layout:fragment="styles">
        <style>
            .select-wrap{max-width:560px;margin:0 auto;}
            .pcard{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;
                padding:20px;margin-bottom:12px;text-decoration:none;color:inherit;transition:border-color .15s;}
            .pcard:hover{border-color:var(--orange);}
            .pcard .name{font-size:19px;font-weight:700;}
            .pcard .meta{font-size:14px;color:var(--sub);margin-top:4px;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="select-wrap">
        <h1 class="mb-4">어떤 프로그램으로 측정할까요?</h1>
        <a class="pcard" th:each="p : ${programs}"
           th:href="@{/measure/{mid}/program/{pid}(mid=${membershipId},pid=${p.id})}">
            <div class="name" th:text="${p.name}">3대 측정</div>
            <div class="meta">항목 <span th:text="${p.itemCount}">3</span>개</div>
        </a>
    </div>
</div>
</body>
</html>
