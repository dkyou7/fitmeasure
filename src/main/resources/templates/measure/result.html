<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>측정 결과</title>
    <th:block layout:fragment="styles">
        <style>
            .head .who{font-size:24px;font-weight:800;letter-spacing:-0.03em;}
            .head .meta{font-size:14px;color:var(--sub);margin-bottom:20px;}
            .head .meta .prog{color:var(--orange);font-weight:600;}
            .rrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;
                display:flex;align-items:center;justify-content:space-between;}
            .rrow .name{font-size:16px;font-weight:600;}
            .rrow .val{font-size:20px;font-weight:800;}
            .rrow .val .u{font-size:13px;color:var(--sub);font-weight:600;margin-left:2px;}
            .chg{font-size:13px;font-weight:700;margin-left:10px;}
            .chg.up{color:var(--orange);}
            .chg.same{color:var(--sub);}
            .rrow.skip{color:var(--sub);}
            .md-h2{font-size:15px;color:var(--sub);font-weight:600;margin:24px 0 10px;}
            .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:100px;
                padding:7px 14px;margin:0 6px 6px 0;font-size:14px;cursor:pointer;}
            .chip:hover,.chip.on{border-color:var(--orange);color:var(--orange);}
            .chartbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;
                margin:6px 0 16px;}
            .empty{color:var(--sub);padding:20px 0;}
            .done{width:100%;padding:15px;background:#1A1A18;color:#fff;border:none;border-radius:12px;
                font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:block;text-align:center;margin-top:16px;}
            .result-wrap{max-width:560px;margin:0 auto;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="result-wrap">
        <div class="head">
            <div class="who" th:text="${result.memberNickname}">이름 없는 곰</div>
            <div class="meta">
                <span class="prog" th:text="${result.programName}">3대 측정</span> ·
                <span th:text="${#temporals.format(result.measuredAt, 'yyyy.MM.dd HH:mm')}">2026.03.05</span>
            </div>
        </div>

        <div th:each="r : ${result.rows}">
            <div class="rrow" th:unless="${r.skipped}">
                <span class="name" th:text="${r.name}">벤치프레스 1RM</span>
                <span>
                    <span class="val" th:text="${r.displayValue}">85<span class="u" th:text="${r.unit}">kg</span></span>
                    <span th:class="'chg ' + (${r.changeLabel} == '첫 측정' ? 'same' : (${r.improved} ? 'up' : 'same'))"
                          th:text="${r.changeLabel}">+5</span>
                </span>
            </div>
            <div class="rrow skip" th:if="${r.skipped}">
                <span class="name" th:text="${r.name}">1km 러닝</span>
                <span>측정 안 함</span>
            </div>
        </div>

        <div class="md-h2">성장 추이</div>
        <div th:with="tracked=${result.rows.?[!skipped]}">
            <div th:if="${tracked.isEmpty()}" class="empty">추이를 그릴 항목이 없습니다.</div>
            <div th:unless="${tracked.isEmpty()}">
                <span class="chip" th:each="r,st : ${tracked}"
                      th:classappend="${st.first} ? 'on'"
                      th:attr="data-mid=${result.membershipId},data-iid=${r.itemId}"
                      th:text="${r.name}" onclick="showTrend(this)">벤치프레스 1RM</span>
                <div class="chartbox"><canvas id="trendChart"></canvas></div>
            </div>
        </div>

        <button class="done"
                style="background:#FF5A1F;margin-bottom:8px;" onclick="share('flex')">자랑 링크 만들기</button>
        <a sec:authorize="hasAnyRole('OWNER','STAFF')" class="done" th:href="@{/members}">완료</a>
        <a sec:authorize="!hasAnyRole('OWNER','STAFF')" class="done" th:href="@{/me}">완료</a>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        const SESSION_ID = /*[[${result.sessionId}]]*/ 0;
        function share(mode) {
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            fetch(`/measure/result/${SESSION_ID}/share`, {
                method: 'POST', headers: { [header]: token }
            })
                .then(r => r.json())
                .then(d => {
                    // d.url = "/s/{token}", 자랑 링크는 뒤에 /flex
                    const path = (mode === 'flex') ? d.url + '/flex' : d.url;
                    const url = location.origin + path;
                    navigator.clipboard.writeText(url);
                    const label = (mode === 'flex') ? '자랑 링크' : '공유 링크';
                    alert(label + '가 복사되었어요\n' + url);
                });
        }
    </script>
    <script th:inline="none">
        let chart = null;
        function showTrend(chip) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
            chip.classList.add('on');
            fetch(`/measure/trend/${chip.dataset.mid}/item/${chip.dataset.iid}`)
                .then(r => r.json())
                .then(d => {
                    if (chart) chart.destroy();
                    chart = new Chart(document.getElementById('trendChart'), {
                        type: 'line',
                        data: {
                            labels: d.labels,
                            datasets: [{
                                label: d.itemName + (d.unit ? ' (' + d.unit + ')' : ''),
                                data: d.values,
                                borderColor: '#FF5A1F',
                                backgroundColor: 'rgba(255,90,31,0.1)',
                                borderWidth: 3, tension: 0.3, fill: true,
                                pointBackgroundColor: '#FF5A1F', pointRadius: 4
                            }]
                        },
                        options: { plugins:{legend:{display:true}}, scales:{y:{beginAtZero:false}} }
                    });
                });
        }
        document.addEventListener('DOMContentLoaded', function () {
            const first = document.querySelector('.chip');
            if (first) showTrend(first);
        });
    </script>
</th:block>
</body>
</html>
