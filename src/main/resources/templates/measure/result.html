<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>측정 결과</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--line:#ECEBE7;--tint:#FFF4EF;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
            line-height:1.6;padding:24px;max-width:560px;margin:0 auto;letter-spacing:-0.01em;}
        .head .who{font-size:24px;font-weight:800;letter-spacing:-0.03em;}
        .head .meta{font-size:14px;color:var(--sub);margin-bottom:20px;}
        .head .meta .prog{color:var(--orange);font-weight:600;}
        .row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;
            display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
        .row:hover{border-color:var(--orange);}
        .row .name{font-size:16px;font-weight:600;}
        .row .val{font-size:20px;font-weight:800;}
        .row .val .u{font-size:13px;color:var(--sub);font-weight:600;margin-left:2px;}
        .chg{font-size:13px;font-weight:700;margin-left:10px;}
        .chg.up{color:var(--orange);}
        .chg.same{color:var(--sub);}
        .skip{color:var(--sub);}
        .chartbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;
            margin:6px 0 16px;display:none;}
        .done{width:100%;padding:15px;background:var(--ink);color:#fff;border:none;border-radius:12px;
            font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:block;text-align:center;margin-top:16px;}
    </style>
</head>
<body>
<div class="head">
    <div class="who" th:text="${result.memberNickname}">이름 없는 곰</div>
    <div class="meta">
        <span class="prog" th:text="${result.programName}">3대 측정</span> ·
        <span th:text="${#temporals.format(result.measuredAt, 'yyyy.MM.dd HH:mm')}">2026.03.05</span>
    </div>
</div>

<div th:each="r : ${result.rows}">
    <div class="row" th:unless="${r.skipped}"
         th:attr="data-mid=${result.membershipId},data-iid=${r.itemId},data-name=${r.name}"
         onclick="toggleChart(this)">
        <span class="name" th:text="${r.name}">벤치프레스 1RM</span>
        <span>
                <span class="val" th:text="${r.displayValue}">85<span class="u" th:text="${r.unit}">kg</span></span>
                <span th:class="'chg ' + (${r.changeLabel} == '첫 측정' ? 'same' : (${r.improved} ? 'up' : 'same'))"
                      th:text="${r.changeLabel}">+5</span>
            </span>
    </div>
    <div class="chartbox"><canvas></canvas></div>

    <div class="row skip" th:if="${r.skipped}">
        <span class="name" th:text="${r.name}">1km 러닝</span>
        <span>측정 안 함</span>
    </div>
</div>

<button class="done" style="background:var(--orange);margin-bottom:8px;" onclick="share()">공유 링크 만들기</button>
<a class="done" th:href="@{/members}">완료</a>

<script th:inline="javascript">
    const SESSION_ID = /*[[${result.sessionId}]]*/ 0;
    function share() {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;
        fetch(`/measure/result/${SESSION_ID}/share`, {
            method: 'POST',
            headers: { [header]: token }
        })
            .then(r => r.json())
            .then(d => {
                const url = location.origin + d.url;
                navigator.clipboard.writeText(url);
                alert('공유 링크가 복사되었어요\n' + url);
            });
    }
</script>

<script th:inline="none">
    function toggleChart(row) {
        const box = row.nextElementSibling;
        if (box.style.display === 'block') { box.style.display = 'none'; return; }
        box.style.display = 'block';
        if (box.dataset.loaded) return;
        box.dataset.loaded = '1';
        const mid = row.dataset.mid, iid = row.dataset.iid;
        fetch(`/measure/trend/${mid}/item/${iid}`)
            .then(r => r.json())
            .then(d => {
                new Chart(box.querySelector('canvas'), {
                    type: 'line',
                    data: {
                        labels: d.labels,
                        datasets: [{
                            label: d.itemName + (d.unit ? ' (' + d.unit + ')' : ''),
                            data: d.values,
                            borderColor: '#FF5A1F',
                            backgroundColor: 'rgba(255,90,31,0.1)',
                            borderWidth: 3, tension: 0.3, fill: true,
                            pointBackgroundColor: '#FF5A1F', pointRadius: 4
                        }]
                    },
                    options: { plugins:{legend:{display:true}}, scales:{y:{beginAtZero:false}} }
                });
            });
    }
</script>
</body>
</html>
