<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${program.name}">프로그램</title>
    <th:block layout:fragment="styles">
        <style>
            .prog-wrap{max-width:720px;margin:0 auto;}
            .back{font-size:14px;color:var(--sub);text-decoration:none;}
            .back:hover{color:var(--orange);}
            .md-h2{font-size:15px;color:var(--sub);font-weight:600;margin:28px 0 10px;}
            .empty{color:var(--sub);padding:20px 0;font-size:14px;}
            .btn-edit{display:inline-block;padding:10px 16px;background:#fff;border:1px solid var(--line);
                border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;color:#1A1A18;}
            .btn-edit:hover{border-color:var(--orange);color:var(--orange);}
            .irow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;
                margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
            .irow .iname{font-size:15px;font-weight:600;}
            .irow .imeta{font-size:13px;color:var(--sub);white-space:nowrap;}
            .irow.off{opacity:0.45;}
            .ranktbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
                border-radius:12px;overflow:hidden;}
            .ranktbl th,.ranktbl td{padding:12px 14px;text-align:right;font-size:14px;
                border-bottom:1px solid var(--line);white-space:nowrap;}
            .ranktbl th:nth-child(-n+2),.ranktbl td:nth-child(-n+2){text-align:left;}
            .ranktbl thead th{background:#FAFAF8;color:var(--sub);font-weight:600;font-size:13px;}
            .ranktbl tbody tr:last-child td{border-bottom:none;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="prog-wrap">
        <a class="back" href="/programs">← 프로그램 목록</a>
        <h1 class="mt-2 mb-1" th:text="${program.name}">3대 측정</h1>
        <p class="text-secondary mb-4">
            권장 측정 주기: <span th:text="${program.recommendedCadenceDays}">28</span>일마다
        </p>

        <a class="btn-edit" th:href="@{/programs/{id}/edit(id=${program.templateId})}">프로그램 편집</a>

        <h2 class="md-h2">측정 항목</h2>
        <div class="irow" th:each="i : ${program.items}" th:classappend="${!i.active} ? 'off'">
            <span class="iname" th:text="${i.name}">벤치프레스 1RM</span>
            <span class="imeta">
                <span th:text="${i.unit}">kg</span>
                <span th:unless="${i.active}"> · 비활성</span>
            </span>
        </div>

        <h2 class="md-h2">회원 순위</h2>
        <div th:if="${ranking.rows.isEmpty()}" class="empty">아직 이 프로그램으로 측정한 회원이 없습니다.</div>
        <table class="ranktbl" th:unless="${ranking.rows.isEmpty()}">
            <thead>
            <tr>
                <th th:if="${ranking.totalRankable}">등수</th>
                <th>이름</th>
                <th th:each="n : ${ranking.itemNames}" th:text="${n}">벤치프레스 1RM</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${ranking.rows}">
                <td th:if="${ranking.totalRankable}" th:text="${r.rank != null ? r.rank : '-'}">1</td>
                <td th:text="${r.memberName}">김근육</td>
                <td th:each="v : ${r.values}" th:text="${v != null ? v : '-'}">123</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
