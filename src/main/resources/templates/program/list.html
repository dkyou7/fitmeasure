<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>측정 프로그램</title>
    <th:block layout:fragment="styles">
        <style>
            .prog-wrap{max-width:640px;margin:0 auto;}
            .newform{display:flex;gap:8px;align-items:center;padding:16px;
                background:#fff;border:1px solid var(--line);border-radius:14px;}
            .newform input[name=name]{flex:1;}
            .newform input[name=cadenceDays]{flex:0 0 100px;}
            .pcard{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;
                padding:18px 20px;margin-bottom:12px;text-decoration:none;color:inherit;transition:border-color .15s;}
            .pcard:hover{border-color:var(--orange);}
            .pcard .pname{font-size:18px;font-weight:700;letter-spacing:-0.02em;}
            .pcard .pmeta{font-size:14px;color:var(--sub);margin-top:4px;}
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="prog-wrap">
        <a class="back" style="margin-bottom: 10px" href="/">← 뒤로 가기</a>
        <h1 class="mb-4">측정 프로그램</h1>

        <form class="newform mb-4" method="post" action="/programs">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input class="form-control" type="text" name="name" placeholder="프로그램 이름 (예: 상체 집중)" required>
            <input class="form-control" type="number" name="cadenceDays" value="28" min="1" title="권장 측정 주기(일)">
            <button class="btn btn-primary" type="submit" style="white-space:nowrap;">새 프로그램</button>
        </form>

        <a class="pcard" th:each="p : ${programs}" th:href="@{/programs/{id}(id=${p.id})}">
            <div class="pname" th:text="${p.name}">3대 측정</div>
            <div class="pmeta">
                항목 <span th:text="${p.itemCount}">3</span>개 ·
                <span th:text="${p.recommendedCadenceDays}">28</span>일마다 권장
            </div>
        </a>

        <div class="text-center text-secondary py-5" th:if="${programs.isEmpty()}">
            아직 프로그램이 없습니다. 위에서 첫 프로그램을 만들어보세요.
        </div>
    </div>
</div>
</body>
</html>
