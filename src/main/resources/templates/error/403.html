<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없어요</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--line:#ECEBE7;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:#F1EFE8;color:var(--ink);line-height:1.6;
            padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;letter-spacing:-0.01em;}
        .card{background:var(--bg);border-radius:24px;padding:44px 32px;max-width:400px;width:100%;
            box-shadow:0 8px 40px rgba(0,0,0,0.08);}
        .code{font-size:64px;font-weight:800;letter-spacing:-0.04em;color:var(--orange);line-height:1;margin-bottom:16px;}
        h1{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:10px;}
        p{font-size:15px;color:var(--sub);margin-bottom:28px;line-height:1.6;}
        .btn{display:inline-block;padding:14px 30px;background:var(--orange);color:#fff;border-radius:12px;
            font-size:15px;font-weight:700;text-decoration:none;}
        .btn:hover{background:#E64500;}
    </style>
</head>
<body>
<div class="card">
    <div class="code">403</div>
    <h1>접근 권한이 없어요</h1>
    <p>이 페이지를 볼 수 있는 권한이 없어요.<br>로그인 계정을 확인해주세요.</p>
    <a class="btn" href="/">홈으로</a>
</div>
</body>
</html>
