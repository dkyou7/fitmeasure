<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · 1RepPlus</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--orange-deep:#E64500;--line:#ECEBE7;--tint:#FFF4EF;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:#F1EFE8;color:var(--ink);line-height:1.6;
            padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;letter-spacing:-0.01em;}
        .wrap{max-width:380px;width:100%;}

        /* 브랜드 히어로 */
        .brand{text-align:center;margin-bottom:22px;}
        .brand .logo{display:inline-flex;align-items:center;gap:10px;}
        .brand .mark{width:44px;height:44px;background:var(--ink);border-radius:12px;position:relative;flex-shrink:0;}
        .brand .mark svg{position:absolute;inset:0;}
        .brand .name{font-size:26px;font-weight:800;letter-spacing:-0.03em;}
        .brand .name .p{color:var(--orange);}
        .brand .tag{font-size:14px;color:var(--sub);margin-top:10px;}

        .card{background:var(--bg);border-radius:24px;padding:30px 28px;width:100%;
            box-shadow:0 8px 40px rgba(0,0,0,0.08);}
        h1{font-size:19px;font-weight:700;letter-spacing:-0.02em;margin-bottom:20px;}
        .err{background:var(--tint);color:var(--orange-deep);font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
        .notice{background:#F1EFE8;color:var(--ink);font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
        input.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:15px;
            font-family:inherit;margin-bottom:10px;}
        input.field:focus{outline:none;border-color:var(--orange);}
        .options{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px;font-size:13px;}
        .options .save{display:flex;align-items:center;gap:6px;color:var(--sub);cursor:pointer;}
        .options .links a{color:var(--sub);text-decoration:none;}
        .options .links a:hover{color:var(--orange);}
        .options .links a.signup{color:var(--orange);font-weight:600;}
        .options .links .bar{color:var(--line);margin:0 6px;}
        .btn{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:10px;
            font-size:16px;font-weight:700;cursor:pointer;}
        .btn:hover{background:var(--orange-deep);}
        .divider{display:flex;align-items:center;gap:12px;margin:24px 0 18px;color:var(--sub);font-size:12px;}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}

        .kakao-btn{display:flex;align-items:center;justify-content:center;gap:8px;
            width:100%;height:48px;background:#FEE500;border:none;border-radius:12px;
            font-family:inherit;font-size:15px;font-weight:600;
            color:rgba(0,0,0,0.85);text-decoration:none;cursor:pointer;transition:filter .12s;}
        .kakao-btn:hover{filter:brightness(0.97);}
        .kakao-btn svg{flex-shrink:0;}

        /* 네이버 로그인 버튼 (공식 디자인 가이드 준수) */
        .naver-btn{display:flex;align-items:center;justify-content:center;gap:8px;
            width:100%;height:48px;background:#03C75A;border:none;border-radius:12px;
            font-family:inherit;font-size:15px;font-weight:600;
            color:#fff;text-decoration:none;cursor:pointer;transition:filter .12s;margin-top:10px;}
        .naver-btn:hover{filter:brightness(0.97);}
        .naver-btn svg{flex-shrink:0;}
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand">
        <div class="logo">
            <div class="mark">
                <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="11,32 20,24 26,27 33,16" fill="none" stroke="#FF5A1F"
                              stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="33" cy="16" r="3.5" fill="#FF5A1F"/>
                    <text x="10" y="20" fill="#fff" font-family="Pretendard,sans-serif"
                          font-size="17" font-weight="800">1</text>
                </svg>
            </div>
            <div class="name">1Rep<span class="p">Plus</span></div>
        </div>
        <div class="tag">측정하고, 기록하고, 더 나아지다</div>
    </div>

    <div class="card">
        <h1>로그인</h1>

        <div class="err" th:if="${param.error}">아이디 또는 비밀번호를 확인해주세요.</div>
        <div class="notice" th:if="${param.signup}">가입이 완료됐어요. 로그인해주세요.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="next" th:value="${param.next}">
            <input class="field" type="tel" name="username" placeholder="아이디" required autofocus>
            <input class="field" type="password" name="password" placeholder="비밀번호" required>

            <div class="options">
                <label class="save">
                    <input type="checkbox" name="remember-me"> 로그인 유지
                </label>
                <span class="links">
                    <a href="#">비밀번호 찾기</a>
                    <span class="bar">|</span>
                    <a class="signup" th:href="@{/signup(next=${param.next})}">회원가입</a>
                </span>
            </div>

            <button type="submit" class="btn">로그인</button>
        </form>

        <div class="divider">간편 로그인</div>

        <a class="kakao-btn" href="/oauth2/authorization/kakao">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill="#000000" d="M9 1.5C4.86 1.5 1.5 4.13 1.5 7.36c0 2.09 1.41 3.92 3.53 4.95
                    -.12.42-.62 2.13-.64 2.26 0 0-.01.11.06.15.07.04.16.01.16.01.19-.03 2.2-1.44 2.55-1.68
                    .43.06.87.09 1.32.09 4.14 0 7.5-2.62 7.5-5.86S13.14 1.5 9 1.5z"/>
            </svg>
            <span>카카오 로그인</span>
        </a>

        <a class="naver-btn" href="/oauth2/authorization/naver">
            <svg width="15" height="15" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill="#fff" d="M13.5 10.7 6.2 0H0v20h6.5V9.3L13.8 20H20V0h-6.5z"/>
            </svg>
            <span>네이버 로그인</span>
        </a>
    </div>
</div>
</body>
</html>
