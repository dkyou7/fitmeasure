<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--line:#ECEBE7;--tint:#FFF4EF;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:#F1EFE8;color:var(--ink);line-height:1.6;
            padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;letter-spacing:-0.01em;}
        .card{background:var(--bg);border-radius:24px;padding:32px 28px;max-width:360px;width:100%;
            box-shadow:0 8px 40px rgba(0,0,0,0.08);}
        .logo{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:24px;}
        .logo .dot{color:var(--orange);}
        label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:6px;}
        input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px;
            font-family:inherit;margin-bottom:16px;}
        input:focus{outline:none;border-color:var(--orange);}
        .btn{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:12px;
            font-size:16px;font-weight:700;cursor:pointer;}
        .btn:hover{background:#E64500;}
        .err{background:var(--tint);color:#E64500;font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">측정<span class="dot">.</span></div>
    <div class="err" th:if="${param.error}">번호 또는 비밀번호를 확인해주세요.</div>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>휴대폰 번호</label>
        <input type="tel" name="phone" placeholder="01012345678" required autofocus>
        <label>비밀번호</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn">로그인</button>
    </form>
</div>
</body>
</html>
