<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>트레이너 관리</title></head>
<body>
<div layout:fragment="content">
    <h1 class="mb-4">트레이너 관리</h1>

    <div class="card p-3 mb-4">
        <div class="row g-2">
            <div class="col"><input class="form-control" name="nickname" id="staff-name" placeholder="트레이너 이름"></div>
            <div class="col-auto">
                <button class="btn btn-primary" hx-post="/owner/staff" hx-include="#staff-name"
                        hx-target="#staffTable" hx-swap="outerHTML"
                        hx-on::after-request="staff-name.value='';">트레이너 추가</button>
            </div>
        </div>
    </div>

    <div th:fragment="staffTable" id="staffTable">
        <table class="table align-middle mb-0">
            <thead><tr><th>이름</th><th>역할</th><th>상태</th><th>등록일</th><th></th></tr></thead>
            <tbody>
            <tr th:each="s : ${staff}" th:style="${s.status.name() == 'DORMANT'} ? 'opacity:0.45;'">
                <td class="fw-semibold" th:text="${s.nickname}">김트레이너</td>
                <td>
                    <span class="badge bg-tint" th:if="${s.isOwner}">사장</span>
                    <span class="text-secondary" style="font-size:13px;" th:unless="${s.isOwner}">트레이너</span>
                </td>
                <td>
                    <button th:if="${!s.isOwner}"
                            th:class="${s.status.name() == 'ACTIVE'} ? 'btn btn-sm btn-outline-secondary' : 'btn btn-sm btn-primary'"
                            th:text="${s.status.name() == 'ACTIVE'} ? '비활성' : '활성화'"
                            th:hx-post="@{/owner/staff/{id}/toggle(id=${s.membershipId})}"
                            hx-target="#staffTable" hx-swap="outerHTML">비활성</button>
                </td>
                <td class="text-secondary" style="font-size:14px;"
                    th:text="${#temporals.format(s.joinedAt, 'yyyy.MM.dd')}">2026.03.05</td>
                <td>
                    <button th:if="${!s.isOwner and s.status.name() == 'ACTIVE'}"
                            class="btn btn-sm btn-outline-secondary"
                            th:hx-post="@{/owner/staff/{id}/deactivate(id=${s.membershipId})}"
                            hx-target="#staffTable" hx-swap="outerHTML">비활성</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
