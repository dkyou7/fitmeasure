<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>운영 현황</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <div class="text-secondary" style="font-size:14px;" th:text="${clubName}">데모 헬스장</div>
        <h1 class="mb-0">운영 현황</h1>
    </div>

    <!-- 현재 플랜 -->
    <div class="card p-4 mb-3">
        <div class="text-secondary" style="font-size:13px;">현재 플랜</div>
        <div class="fw-bold" style="font-size:24px;" th:text="${club.plan.label}">무료</div>
        <div class="text-secondary" style="font-size:13px;" th:if="${club.planExpiresAt != null}">
            만료일 <span th:text="${#temporals.format(club.planExpiresAt, 'yyyy.MM.dd')}">2027.01.01</span>
        </div>

        <!-- 신청 대기 중 -->
        <div th:if="${club.hasPendingRequest()}" class="alert mt-3"
             style="background:#FFF4EF;border:1px solid #FF5A1F;border-radius:10px;padding:12px 14px;">
        <span class="text-primary fw-semibold" th:text="${club.requestedPlan.label} + ' 신청됨 · 승인 대기 중'">
            신청됨
        </span>
            <form th:action="@{/owner/billing/cancel}" method="post" class="d-inline ms-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-secondary">신청 취소</button>
            </form>
        </div>
    </div>

    <!-- 플랜 신청 (신청 대기 없을 때만) -->
    <div th:unless="${club.hasPendingRequest()}" class="row g-3">
        <div class="col-md-6">
            <div class="card p-4 text-center">
                <div class="fw-bold" style="font-size:18px;">유료 월간</div>
                <div class="text-secondary my-2" style="font-size:13px;">매월 결제</div>
                <form th:action="@{/owner/billing/request}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="plan" value="MONTHLY">
                    <button class="btn btn-primary w-100" th:disabled="${club.plan.name() == 'MONTHLY'}">
                        월간 신청
                    </button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4 text-center">
                <div class="fw-bold" style="font-size:18px;">유료 연간</div>
                <div class="text-secondary my-2" style="font-size:13px;">연 단위 결제 (할인)</div>
                <form th:action="@{/owner/billing/request}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="plan" value="YEARLY">
                    <button class="btn btn-primary w-100" th:disabled="${club.plan.name() == 'YEARLY'}">
                        연간 신청
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 회원 사용량 -->
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <div class="card p-4 h-100">
                <div class="text-secondary" style="font-size:13px;">등록 회원</div>
                <div class="d-flex align-items-baseline gap-2">
                    <span class="fw-bold" style="font-size:28px;" th:text="${memberCount}">0</span>
                    <span class="text-secondary">/ <span th:text="${freeLimit}">10</span>명</span>
                </div>
                <!-- 사용량 바 -->
                <div class="mt-2" style="height:8px;background:#F1EFE8;border-radius:100px;overflow:hidden;">
                    <div th:style="'width:' + (${memberCount} * 100 / ${freeLimit} > 100 ? 100 : ${memberCount} * 100 / ${freeLimit}) + '%;height:100%;background:' + (${overLimit} ? '#E64500' : '#FF5A1F') + ';'"></div>
                </div>
                <div class="text-primary fw-semibold mt-2" style="font-size:13px;" th:if="${overLimit}">
                    무료 한도를 초과했어요. 유료 전환이 필요합니다.
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4 h-100">
                <div class="text-secondary" style="font-size:13px;">트레이너</div>
                <span class="fw-bold" style="font-size:28px;" th:text="${staffCount}">1</span>
                <span class="text-secondary">명</span>
            </div>
        </div>
    </div>

    <!-- 결제 예정 (목업) -->
    <div class="card p-4">
        <div class="text-secondary mb-2" style="font-size:13px;">결제 정보</div>
        <div th:if="${plan == 'FREE'}" class="text-secondary">
            무료 플랜 사용 중이라 결제 내역이 없습니다.
        </div>
        <div th:if="${plan == 'PAID'}">
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span class="text-secondary">다음 결제 예정일</span>
                <span class="fw-semibold" th:text="${#temporals.format(nextBillingDate, 'yyyy.MM.dd')}">2026.10.01</span>
            </div>
            <div class="d-flex justify-content-between py-2">
                <span class="text-secondary">결제 수단</span>
                <span class="text-secondary">등록된 수단 없음 (준비 중)</span>
            </div>
        </div>
        <div class="text-secondary mt-3" style="font-size:12px;">
            * 결제 기능은 준비 중입니다. 도입 문의로 안내받으실 수 있어요.
        </div>
    </div>
</div>
</body>
</html>
