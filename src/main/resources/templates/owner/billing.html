<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>운영 현황</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <div class="text-secondary" style="font-size:14px;" th:text="${clubName}">데모 헬스장</div>
        <h1 class="mb-0">운영 현황</h1>
    </div>

    <!-- 현재 플랜 -->
    <div class="card p-4 mb-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <div class="text-secondary" style="font-size:13px;">현재 플랜</div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold" style="font-size:24px;"
                          th:text="${plan == 'FREE'} ? '무료 플랜' : '유료 플랜'">무료 플랜</span>
                    <span class="badge bg-tint" th:if="${plan == 'FREE'}">10명까지 무료</span>
                </div>
            </div>
            <a class="btn btn-primary" href="/owner/plans" th:if="${plan == 'FREE'}">유료 전환하기</a>
        </div>
    </div>

    <!-- 회원 사용량 -->
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <div class="card p-4 h-100">
                <div class="text-secondary" style="font-size:13px;">등록 회원</div>
                <div class="d-flex align-items-baseline gap-2">
                    <span class="fw-bold" style="font-size:28px;" th:text="${memberCount}">0</span>
                    <span class="text-secondary">/ <span th:text="${freeLimit}">10</span>명</span>
                </div>
                <!-- 사용량 바 -->
                <div class="mt-2" style="height:8px;background:#F1EFE8;border-radius:100px;overflow:hidden;">
                    <div th:style="'width:' + (${memberCount} * 100 / ${freeLimit} > 100 ? 100 : ${memberCount} * 100 / ${freeLimit}) + '%;height:100%;background:' + (${overLimit} ? '#E64500' : '#FF5A1F') + ';'"></div>
                </div>
                <div class="text-primary fw-semibold mt-2" style="font-size:13px;" th:if="${overLimit}">
                    무료 한도를 초과했어요. 유료 전환이 필요합니다.
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4 h-100">
                <div class="text-secondary" style="font-size:13px;">트레이너</div>
                <span class="fw-bold" style="font-size:28px;" th:text="${staffCount}">1</span>
                <span class="text-secondary">명</span>
            </div>
        </div>
    </div>

    <!-- 결제 예정 (목업) -->
    <div class="card p-4">
        <div class="text-secondary mb-2" style="font-size:13px;">결제 정보</div>
        <div th:if="${plan == 'FREE'}" class="text-secondary">
            무료 플랜 사용 중이라 결제 내역이 없습니다.
        </div>
        <div th:if="${plan == 'PAID'}">
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span class="text-secondary">다음 결제 예정일</span>
                <span class="fw-semibold" th:text="${#temporals.format(nextBillingDate, 'yyyy.MM.dd')}">2026.10.01</span>
            </div>
            <div class="d-flex justify-content-between py-2">
                <span class="text-secondary">결제 수단</span>
                <span class="text-secondary">등록된 수단 없음 (준비 중)</span>
            </div>
        </div>
        <div class="text-secondary mt-3" style="font-size:12px;">
            * 결제 기능은 준비 중입니다. 도입 문의로 안내받으실 수 있어요.
        </div>
    </div>
</div>
</body>
</html>
