<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>헬스장 정보</title></head>
<body>
<div layout:fragment="content">
    <div style="max-width:560px;margin:0 auto;">
        <h1 class="mb-1">헬스장 정보</h1>
        <p class="text-secondary mb-4" style="font-size:14px;">
            회원들이 '헬스장 찾기'에서 보는 정보예요.
        </p>

        <div class="alert" th:if="${param.saved}"
             style="background:#FFF4EF;border:1px solid #FF5A1F;border-radius:12px;padding:12px 16px;margin-bottom:16px;">
            <span class="text-primary fw-semibold">저장됐어요.</span>
        </div>

        <form th:action="@{/owner/club}" method="post" class="card p-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label class="form-label fw-semibold">헬스장 이름</label>
                <input class="form-control" name="name" th:value="${club.name}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">주소</label>
                <input class="form-control" name="address" th:value="${club.address}" placeholder="예: 서울 강남구 ...">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">소개</label>
                <textarea class="form-control" name="intro" rows="4"
                          placeholder="우리 헬스장의 측정 서비스를 소개해주세요. 회원들에게 보여집니다."
                          th:text="${club.intro}"></textarea>
                <div class="form-text">회원이 헬스장 상세에서 보는 소개 문구예요.</div>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="listed" id="listed"
                       value="true" th:checked="${club.listed}">
                <label class="form-check-label" for="listed">
                    <b>헬스장 찾기에 공개</b> — 회원들이 검색·발견할 수 있어요
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100">저장</button>
        </form>
    </div>
</div>
</body>
</html>
