<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head><title>운영 관리자</title></head>
<body>
<div layout:fragment="content">
    <h1 class="mb-4">플랫폼 관리
        <a href="/admin/clubs/new" class="btn btn-primary btn-sm ms-2">+ 헬스장 등록</a>
    </h1>

    <div class="card p-3 mb-4" th:if="${!applications.isEmpty()}"
         style="border-color:#FF5A1F;">
        <div class="fw-bold mb-2">승인 대기 신청
            <span class="badge bg-primary" th:text="${applications.size()}">0</span>
        </div>
        <table class="table align-middle mb-0">
            <thead><tr><th>헬스장</th><th>유형</th><th>신청자</th><th>연락처</th><th>주소</th><th>신청일</th><th></th></tr></thead>
            <tbody>
            <tr th:each="a : ${applications}">
                <td class="fw-semibold" th:text="${a.name}">강남 파워짐</td>
                <td class="text-secondary" style="font-size:13px;" th:text="${a.type}">GYM</td>
                <td th:text="${a.applicantName}">홍길동</td>
                <td class="text-secondary" style="font-size:13px;" th:text="${a.phone} ?: '-'">02-000-0000</td>
                <td class="text-secondary" style="font-size:13px;" th:text="${a.address} ?: '-'">서울 강남구</td>
                <td class="text-secondary" style="font-size:13px;"
                    th:text="${#temporals.format(a.appliedAt, 'yyyy.MM.dd')}">2026.03.05</td>
                <td class="text-end">
                    <form th:action="@{/admin/applications/{id}/approve(id=${a.clubId})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-primary">승인</button>
                    </form>
                    <form th:action="@{/admin/applications/{id}/reject(id=${a.clubId})}" method="post" class="d-inline"
                          onsubmit="return confirm('이 신청을 거절할까요?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-secondary">거절</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card p-3">
                <div class="text-secondary" style="font-size:13px;">전체 클럽</div>
                <span class="fw-bold" style="font-size:26px;" th:text="${stats.totalClubs}">0</span>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card p-3">
                <div class="text-secondary" style="font-size:13px;">유료 클럽</div>
                <span class="fw-bold text-primary" style="font-size:26px;" th:text="${stats.paidClubs}">0</span>
            </div>
        </div>
    </div>

    <div th:fragment="clubTable" id="clubTable" class="card">
        <table class="table align-middle mb-0">
            <thead><tr><th>클럽</th><th>플랜</th><th>만료일</th><th>회원</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${clubs}">
                <td>
                    <a th:href="@{/admin/clubs/{id}(id=${c.clubId})}" th:text="${c.name}"
                       style="color:inherit;text-decoration:none;font-weight:600;">데모 헬스장</a>
                </td>
                <td>
                    <span th:class="${c.plan != 'FREE'} ? 'badge bg-primary' : 'badge bg-tint'"
                          th:text="${c.planLabel}">무료</span>
                    <span th:if="${c.requestedPlan != null}" class="badge bg-warning text-dark ms-1"
                          th:text="${c.requestedLabel} + ' 신청'">신청</span>
                </td>
                <td class="text-secondary" style="font-size:13px;"
                    th:text="${c.planExpiresAt != null} ? ${#temporals.format(c.planExpiresAt, 'yy.MM.dd')} : '-'">-</td>
                <td th:text="${c.memberCount}">0</td>
                <td class="text-end">
                    <a th:href="@{/admin/clubs/{id}(id=${c.clubId})}"
                       class="btn btn-sm btn-outline-secondary">관리</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
