<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>헬스장 등록</title></head>
<body>
<div layout:fragment="content">
    <div style="max-width:520px;margin:0 auto;">
        <a class="text-secondary text-decoration-none" href="/admin" style="font-size:14px;">← 관리로</a>
        <h1 class="mt-2 mb-4">헬스장 등록 (계약)</h1>

        <!-- 1. 사장 계정 검색 -->
        <div class="card p-4 mb-3">
            <label class="form-label fw-semibold">사장님 아이디 검색</label>
            <div class="text-secondary mb-2" style="font-size:13px;">
                사장님이 먼저 회원가입한 계정을 검색해 연결하세요.
            </div>
            <div class="d-flex gap-2">
                <input class="form-control" id="uname" name="username" placeholder="아이디">
                <button class="btn btn-outline-secondary" type="button"
                        hx-get="/admin/clubs/new/search" hx-include="#uname"
                        hx-target="#searchResult" hx-swap="outerHTML">검색</button>
            </div>

            <div th:fragment="searchResult" id="searchResult">
                <div th:if="${searched and result == null}"
                     class="text-secondary mt-3" style="font-size:13px;">
                    해당 아이디의 계정이 없어요. 사장님께 먼저 회원가입을 안내하세요.
                </div>
                <div th:if="${result != null}" class="mt-3">
                    <div style="background:#F6F5F1;border-radius:12px;padding:14px 16px;">
                        <div style="font-size:13px;color:var(--sub);">연결할 계정</div>
                        <div style="font-weight:700;">
                            <span th:text="${result.name} ?: '(이름 없음)'">홍길동</span>
                            <span class="text-secondary" style="font-size:13px;"
                                  th:text="'@' + ${result.username}">@hong</span>
                        </div>
                    </div>

                    <!-- 2. 클럽 정보 + 생성 -->
                    <form th:action="@{/admin/clubs}" method="post" class="mt-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="memberId" th:value="${result.memberId}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">헬스장 이름</label>
                            <input class="form-control" name="clubName" placeholder="예: 스트롱짐 강남점" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">유형</label>
                            <select class="form-select" name="type">
                                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">이 계정을 사장으로 헬스장 등록</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
