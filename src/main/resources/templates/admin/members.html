<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>회원 관리</title></head>
<body>
<div layout:fragment="content">
    <a class="back" th:href="@{/admin}"
       style="margin-bottom: 10px" >← 뒤로 가기</a>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">회원 관리</h4>
    </div>

    <form th:action="@{/admin/members}" method="get" class="mb-3">
        <div class="input-group" style="max-width: 420px;">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="이름 또는 전화번호 검색">
            <button class="btn btn-primary" type="submit">검색</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>이름</th>
                <th>전화번호</th>
                <th>로그인 수단</th>
                <th class="text-center">플랫폼 관리자</th>
                <th>가입일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${page.content}">
                <td th:text="${row.name} ?: '(이름 없음)'">홍길동</td>
                <td th:text="${row.phone} ?: '-'">01012345678</td>
                <td>
                    <span th:each="u : ${row.usernames}"
                          class="badge bg-secondary me-1" th:text="${u}">user01</span>
                    <span th:if="${row.hasSocial}"
                          class="badge bg-info text-dark">소셜</span>
                    <span th:if="${#lists.isEmpty(row.usernames)} and ${!row.hasSocial}"
                          class="text-muted">-</span>
                </td>
                <td class="text-center">
                    <span th:if="${row.platformAdmin}" class="badge bg-danger">ADMIN</span>
                    <span th:unless="${row.platformAdmin}" class="text-muted">-</span>
                </td>
                <td th:text="${#temporals.format(row.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
            </tr>
            <tr th:if="${page.isEmpty()}">
                <td colspan="7" class="text-center text-muted py-4">회원이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${page.totalPages > 1}" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/members(keyword=${keyword}, page=${page.number - 1})}">이전</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link"
                      th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 3</span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/members(keyword=${keyword}, page=${page.number + 1})}">다음</a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>
