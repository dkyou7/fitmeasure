<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>헬스장 오픈 신청</title></head>
<body>
<div layout:fragment="content">
    <div style="max-width:560px;margin:0 auto;">
        <h1 class="mb-1">헬스장 오픈 신청</h1>
        <div class="alert" th:if="${error}"
             style="background:#FFF4EF;border:1px solid #FF5A1F;border-radius:12px;padding:12px 16px;margin-bottom:16px;">
            <span class="text-primary fw-semibold" th:text="${error}">안내</span>
        </div>
        <p class="text-secondary mb-4" style="font-size:14px;">
            신청하시면 운영자 확인 후 승인해드려요. 승인되면 바로 헬스장을 운영할 수 있어요.
        </p>

        <form th:action="@{/apply}" method="post" class="card p-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label class="form-label fw-semibold">헬스장 이름</label>
                <input class="form-control" name="name" required autofocus placeholder="예: 강남 파워짐">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">유형</label>
                <select class="form-select" name="type" required>
                    <option value="" disabled selected>선택하세요</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.name()}">GYM</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">대표님 연락처</label>
                <input class="form-control" name="phone" placeholder="예: 02-000-0000">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">주소</label>
                <input class="form-control" name="address" placeholder="예: 서울 강남구 ...">
            </div>

            <button type="submit" class="btn btn-primary w-100">신청하기</button>
        </form>
    </div>
</div>
</body>
</html>
