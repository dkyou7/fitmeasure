<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헬스장 만들기</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--line:#ECEBE7;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:#F1EFE8;color:var(--ink);line-height:1.6;
            padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;letter-spacing:-0.01em;}
        .card{background:var(--bg);border-radius:24px;padding:32px 28px;max-width:400px;width:100%;
            box-shadow:0 8px 40px rgba(0,0,0,0.08);}
        h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;}
        .sub{font-size:14px;color:var(--sub);margin-bottom:24px;}
        label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:6px;}
        input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:15px;
            font-family:inherit;margin-bottom:16px;}
        input:focus,select:focus{outline:none;border-color:var(--orange);}
        .btn{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:12px;
            font-size:16px;font-weight:700;cursor:pointer;}
        .btn:hover{background:#E64500;}
    </style>
</head>
<body>
<div class="card">
    <h1>헬스장 만들기</h1>
    <div class="sub">내 헬스장을 만들고 회원 측정을 시작하세요</div>
    <form th:action="@{/clubs}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>이름</label>
        <input type="text" name="name" placeholder="예: 스트롱짐 강남점" required autofocus>
        <label>유형</label>
        <select name="type">
            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
        </select>
        <button type="submit" class="btn">만들기</button>
    </form>
</div>
</body>
</html>
