<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title layout:title-pattern="$CONTENT_TITLE">1RepPlus</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--orange-deep:#E64500;--line:#ECEBE7;--tint:#FFF4EF;
            --bs-primary:#FF5A1F;--bs-primary-rgb:255,90,31;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--ink);
            letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;}

        /* Bootstrap primary 버튼을 브랜드 오렌지로 */
        .btn-primary{
            --bs-btn-bg:#FF5A1F;--bs-btn-border-color:#FF5A1F;
            --bs-btn-hover-bg:#E64500;--bs-btn-hover-border-color:#E64500;
            --bs-btn-active-bg:#E64500;--bs-btn-active-border-color:#E64500;
            --bs-btn-disabled-bg:#FF5A1F;--bs-btn-disabled-border-color:#FF5A1F;
        }
        .text-primary{color:#FF5A1F !important;}
        .badge.bg-tint{background:#FFF4EF;color:#E64500;font-weight:600;}
        /* 상단 헤더 — 하단 탭바와 높이·폭 통일 */
        .m-header{position:sticky;top:0;z-index:50;background:rgba(253,253,252,0.95);
            backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:64px;
            display:flex;align-items:center;justify-content:space-between;
            max-width:520px;margin:0 auto;padding:0 20px;}
        .m-header .logo{font-weight:800;font-size:18px;letter-spacing:-0.03em;text-decoration:none;color:var(--ink);}
        .m-header .logo .dot{color:var(--orange);}
        .m-header .h-right{display:flex;align-items:center;gap:6px;}
        .m-header .h-btn{font-size:13px;color:var(--sub);text-decoration:none;padding:6px 8px;
            background:none;border:none;cursor:pointer;font-family:inherit;}

        /* 본문 — 상단 64 + 하단 탭바 공간 */
        .m-main{max-width:520px;margin:0 auto;padding:20px 20px 84px;min-height:calc(100vh - 64px);}

        /* 하단 탭바 (기존, 폭·높이 그대로) */
        .m-tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;
            background:rgba(253,253,252,0.95);backdrop-filter:blur(12px);
            border-top:1px solid var(--line);height:64px;
            display:flex;max-width:520px;margin:0 auto;}
        .m-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:3px;text-decoration:none;color:var(--sub);font-size:11px;font-weight:600;
            padding-bottom:env(safe-area-inset-bottom,0);}
        .m-tab .ic{font-size:20px;line-height:1;}
        .m-tab.active{color:var(--orange);}
        /* 콘텐츠 등장 애니메이션 */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .m-main > * {
            animation: fadeUp 2s ease both;
        }
    </style>
    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<!-- 상단 헤더 -->
<div class="m-header">
    <a class="logo" href="/me">1RepPlus<span class="dot">.</span></a>
    <div class="h-right">
        <a sec:authorize="hasAnyRole('OWNER','STAFF')" href="/" class="h-btn">관리</a>
        <a sec:authorize="hasRole('ADMIN')" href="/admin" class="h-btn">관리</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="h-btn" type="submit">로그아웃</button>
        </form>
    </div>
</div>

<!-- 본문 -->
<div class="m-main" layout:fragment="content"></div>

<!-- 하단 탭바 -->
<nav class="m-tabbar">
    <a class="m-tab" href="/me" th:classappend="${activeTab == 'gyms'} ? 'active'">
        <i class="bi bi-geo-alt ic"></i> 홈
    </a>
    <a class="m-tab" href="/me/records" th:classappend="${activeTab == 'feed'} ? 'active'">
        <i class="bi bi-graph-up-arrow ic"></i> 내 기록
    </a>
    <a class="m-tab" href="/me/connect" th:classappend="${activeTab == 'connect'} ? 'active'">
        <i class="bi bi-qr-code ic"></i> 연결
    </a>
    <a class="m-tab" href="/me/profile" th:classappend="${activeTab == 'profile'} ? 'active'">
        <i class="bi bi-person ic"></i> 내 정보
    </a>
</nav>

<th:block layout:fragment="scripts"></th:block>
</body>
</html>
