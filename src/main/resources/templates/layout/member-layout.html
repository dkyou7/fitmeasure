<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE">내 운동력</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--orange-deep:#E64500;--line:#ECEBE7;--tint:#FFF4EF;}
        body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-0.01em;}
        .mnav{position:sticky;top:0;z-index:50;background:rgba(253,253,252,0.9);backdrop-filter:blur(12px);
            border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;}
        .mnav-in{max-width:600px;margin:0 auto;padding:0 20px;width:100%;display:flex;
            align-items:center;justify-content:space-between;}
        .mnav .logo{font-weight:800;font-size:18px;letter-spacing:-0.03em;text-decoration:none;color:var(--ink);}
        .mnav .logo .dot{color:var(--orange);}
        .mmain{max-width:600px;margin:0 auto;padding:24px 20px;}
    </style>
    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<div class="mnav">
    <div class="mnav-in">
        <a class="logo" href="/me">내 운동력<span class="dot">.</span></a>
        <div class="d-flex align-items-center gap-2">
            <a sec:authorize="hasAnyRole('OWNER','STAFF')" href="/" class="btn btn-sm btn-outline-secondary">관리 화면</a>
            <a sec:authorize="hasRole('ADMIN')" href="/admin" class="btn btn-sm btn-outline-secondary">관리 화면</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-secondary">로그아웃</button>
            </form>
        </div>
    </div>
</div>
<div class="mmain" layout:fragment="content"></div>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
