<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>홈</title></head>
<body>
<div layout:fragment="content">

    <div class="mb-4">
        <div class="text-secondary" style="font-size:14px;" th:text="${clubName}">데모 헬스장</div>
        <h1 class="mb-0">오늘도 회원의 성장을 기록하세요</h1>
    </div>

    <!-- 지표 -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
            <div class="card p-3 h-100">
                <div class="text-secondary" style="font-size:13px;">등록 회원</div>
                <div class="d-flex align-items-baseline gap-2">
                    <span class="fw-bold" style="font-size:28px;" th:text="${memberCount}">0</span>
                    <span class="text-secondary" style="font-size:13px;">
                        / <span th:text="${freeLimit}">10</span>명 무료
                    </span>
                </div>
                <div class="text-primary fw-semibold mt-1" style="font-size:12px;" th:if="${overLimit}">
                    무료 한도를 초과했어요
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card p-3 h-100">
                <div class="text-secondary" style="font-size:13px;">측정 프로그램</div>
                <span class="fw-bold" style="font-size:28px;" th:text="${programCount}">2</span>
            </div>
        </div>
    </div>

    <!-- 바로가기 -->
    <div class="row g-3">
        <div class="col-md-4">
            <a class="card p-4 h-100 text-decoration-none text-body d-block" href="/members">
                <div class="fw-bold mb-1" style="font-size:18px;">회원 측정하기 →</div>
                <div class="text-secondary" style="font-size:14px;">회원을 선택해 오늘의 운동력을 기록합니다.</div>
            </a>
        </div>
        <div class="col-md-4">
            <a class="card p-4 h-100 text-decoration-none text-body d-block" href="/programs">
                <div class="fw-bold mb-1" style="font-size:18px;">프로그램 관리 →</div>
                <div class="text-secondary" style="font-size:14px;">측정 항목을 구성하고 우리 클럽에 맞게 커스텀합니다.</div>
            </a>
        </div>
        <div class="col-md-4">
            <a class="card p-4 h-100 text-decoration-none text-body d-block" href="/dashboard">
                <div class="fw-bold mb-1" style="font-size:18px;">측정 명단 →</div>
                <div class="text-secondary" style="font-size:14px;">측정할 때가 된 회원을 확인합니다.</div>
            </a>
        </div>
    </div>

</div>
</body>
</html>
