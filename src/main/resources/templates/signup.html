<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 · 1RepPlus</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{--bg:#FDFDFC;--ink:#1A1A18;--sub:#6B6B66;--orange:#FF5A1F;--orange-deep:#E64500;--line:#ECEBE7;--tint:#FFF4EF;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Pretendard',sans-serif;background:#F1EFE8;color:var(--ink);line-height:1.6;
            padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;letter-spacing:-0.01em;}
        .wrap{max-width:380px;width:100%;}

        .brand{text-align:center;margin-bottom:22px;}
        .brand .logo{display:inline-flex;align-items:center;gap:10px;}
        .brand .mark{width:44px;height:44px;background:var(--ink);border-radius:12px;position:relative;flex-shrink:0;}
        .brand .mark svg{position:absolute;inset:0;}
        .brand .name{font-size:26px;font-weight:800;letter-spacing:-0.03em;}
        .brand .name .p{color:var(--orange);}
        .brand .tag{font-size:14px;color:var(--sub);margin-top:10px;}

        .card{background:var(--bg);border-radius:24px;padding:30px 28px;width:100%;
            box-shadow:0 8px 40px rgba(0,0,0,0.08);}
        h1{font-size:19px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px;}
        .sub{font-size:14px;color:var(--sub);margin-bottom:20px;}
        .err{background:var(--tint);color:var(--orange-deep);font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
        input.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:15px;
            font-family:inherit;margin-bottom:10px;}
        input.field:focus{outline:none;border-color:var(--orange);}
        .btn{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:10px;
            font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;}
        .btn:hover{background:var(--orange-deep);}
        .foot{text-align:center;font-size:13px;color:var(--sub);margin-top:18px;}
        .foot a{color:var(--orange);font-weight:600;text-decoration:none;}
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand">
        <div class="logo">
            <div class="mark">
                <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="11,32 20,24 26,27 33,16" fill="none" stroke="#FF5A1F"
                              stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="33" cy="16" r="3.5" fill="#FF5A1F"/>
                    <text x="10" y="20" fill="#fff" font-family="Pretendard,sans-serif"
                          font-size="17" font-weight="800">1</text>
                </svg>
            </div>
            <div class="name">1Rep<span class="p">Plus</span></div>
        </div>
        <div class="tag">측정하고, 기록하고, 더 나아지다</div>
    </div>

    <div class="card">
        <h1>회원가입</h1>
        <div class="sub">계정을 만들고 내 성장 기록을 이어가세요</div>

        <div class="err" th:if="${error}" th:text="${error}">오류</div>

        <form th:action="@{/signup}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input class="field" type="text" name="username" placeholder="아이디" required autofocus>
            <input class="field" type="password" name="password" placeholder="비밀번호" required>
            <input class="field" type="text" name="name" placeholder="이름 (선택)">
            <button type="submit" class="btn">가입하기</button>
        </form>

        <div class="foot">
            이미 계정이 있으신가요? <a href="/login">로그인</a>
        </div>
    </div>
</div>
</body>
</html>
